{% extends "base.html" %}
{% block title %}Tasks{% endblock %}
{% block content %}
<div class="task-box">
    <h2>Tasks</h2>
    <form action="{{ url_for('tasks.add_task') }}" method="POST"class="task-form">
        <input type="text" name="title" placeholder=" NewTask" required>
        <label for="title">Task Title</label>
        <button type="submit" class="btn">Add Task</button>
    </form>
    {% if tasks %}
    <form method="POST" action="{{ url_for('tasks.clear_tasks') }}">
        <button type="submit" class="btn btn-clear">Clear All Tasks</button>
    </form>
    <br>
    <table class="task-table">
        <thead>
            <tr>
                <th>Task</th>
                <th>Status</th>
                <th>Change</th>
            </tr>
        </thead>
        <tbody>
            {% for task in tasks %}
            <tr>
                <td>{{ loop.index }}</td>
                <td>{{ task.title }}</td>
                <td>
                    <span class="badge {{ task.status }}">{{ task.status }}</span>
                </td>
                <td>
                    <form method="POST" action="{{ url_for('tasks.toggle_task_status', task_id=task.id) }}" method="POST">
                        <button type="submit" class="bi-small">Next</button>
                    </form>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
    <p>No tasks available yet.Add one above.</p>
    {% endif %}
</div>
{% endblock %}
